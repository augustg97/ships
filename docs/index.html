<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ships — how we learned to cross the ocean</title>
<meta name="description" content="The world ocean as a machine of wind, current and ice — and the ships built to cross it.">
<link rel="stylesheet" href="css/styles.css?v=1788865724">
<meta name="data-version" content="1788865724">
</head>
<body>


<canvas id="gl"></canvas>


<div id="labels"></div>

<div id="splash">
  <div class="sp-inner">
    <h1>Ships</h1>
    <div class="bar"><i></i></div>
    <p class="note" id="loadnote">sounding the sea floor…</p>
  </div>
</div>



<nav id="tabs">
  
  <button class="tab on" data-view="ship"><b>The Shipwright</b></button>
  <button class="tab" data-view="sea"><b>The Sea</b></button>
  <button class="tab" data-view="action"><b>The Action</b><span>a fleet from the water</span></button>
</nav>

<div id="readout" class="panel">
  <div class="ro-era" id="roEra">—</div>
  <div class="ro-date" id="roDate">—</div>
  <div class="ro-stats" id="roStats"></div>
</div>


<div id="rail" class="panel">
  <div class="rail-body">
    <h3 class="rule">The sea</h3>
    <label><input type="checkbox" id="lySeafloor" checked> Sea floor through the water</label>
    <label><input type="checkbox" id="lyWind" checked> Wind on the surface</label>
    <label><input type="checkbox" id="lyChl" checked> What lives in the water</label>
    <label><input type="checkbox" id="lyIce" checked> Sea ice</label>
    <label><input type="checkbox" id="lyCloud"> Cloud</label>
    <h3 class="rule">Marks</h3>
    <label><input type="checkbox" id="lyPorts" checked> Ports and seas</label>
    <h3 class="rule">Season</h3>
    <input type="range" id="month" min="0" max="11.99" step="0.01" value="6.5">
    <div class="mrow"><span class="mn" id="monthName">July</span>
      <button id="monthPlay" class="mini">Cycle</button></div>
  </div>
</div>


<div id="voyages" class="panel">
  <h3 class="rule">Voyages of this era</h3>
  <div id="voyList"></div>
</div>


<div id="card" class="panel hidden">
  <button id="cardClose" class="x">×</button>
  <div class="c-eyebrow" id="cEyebrow"></div>
  <h2 id="cTitle"></h2>
  <div class="c-sub" id="cSub"></div>
  <div class="c-rows" id="cRows"></div>
  <div class="c-prose" id="cProse"></div>
  <div class="c-span" id="cSpan"></div>
  <div class="c-cite" id="cCite"></div>
</div>


<div id="eras">
  <div class="era-strip" id="eraStrip"></div>
  <div class="era-detail">
    <div class="txt">
      <div class="hd" id="eraHd">—</div>
      <div class="sm" id="eraSm"></div>
    </div>
    <div class="yr">
      <input type="range" id="yr" min="0" max="1000" step="1" value="1000">
      <span class="ylab" id="yrLab">—</span>
      <button id="eraAbout" class="mini">About</button>
    </div>
  </div>
</div>


<div id="yard" class="hidden">
  <canvas id="yardCanvas"></canvas>
  <div id="yardNote"></div>
  <button id="yardClose" class="mini">Back to the sea</button>
  <div id="yardBar">
    <div class="meta">
      <h2 id="yardTitle"></h2>
      <div class="sub" id="yardSub"></div>
      <div class="dims" id="yardDims"></div>
    </div>
    <div id="yardCtl">
      <button id="swOpen" class="mini">Take her apart</button>
      <button id="yardCard" class="mini">Read the card</button>
    </div>
  </div>
</div>


<div id="campBar" class="panel hidden">
  <div class="cb-head">
    <span class="cb-day" id="campDay">—</span>
    <span class="cb-wind" id="campWind"></span>
    <button id="btOpen" class="mini">Go down to the water</button>
    <button id="campClose" class="x">×</button>
  </div>
  <div class="gauge" id="campGauge"></div>
  <div class="cb-text" id="campText"></div>
</div>


<div id="shipwright" class="hidden">
  <canvas id="swCanvas"></canvas>
  <div id="swLabels"></div>
  <div id="swRuler"><i></i><b></b></div>
  <div id="swNav">
    <button id="swPrev" class="mini" title="Previous ship">←</button>
    <span id="swNavPos"></span>
    <button id="swNext" class="mini" title="Next ship">→</button>
    <button id="swFurl" class="mini" title="Stow the canvas, or set it">Furl sails</button>
  </div>
  <div id="swLeft">
    <h2 id="swTitle"></h2>
    <div class="sub" id="swSub"></div>
    <div class="dims" id="swDims"></div>
    <div class="sect" id="swCap"></div>
    <div class="sect" id="swStory"></div>
    <div class="sect" id="swRows"></div>
    <div class="cite" id="swCite"></div>
  </div>
  <div id="swBuild">
    <div class="bh"><span id="swStageName">Bent on</span>
      <span class="ord" id="swOrder"></span></div>
    <input type="range" id="swStage" min="0" max="7" step="1" value="7">
    <div class="bw" id="swStageWhat"></div>
  </div>
  <div id="swList">
    <div class="hd">The fleet</div>
    <div class="ls" id="swListBody"></div>
  </div>
  <div id="swFleet"></div>
</div>


<div id="battle" class="hidden">
  <canvas id="btCanvas"></canvas>
  <div id="btBar">
    <div class="bh">
      <span class="d" id="btDate">—</span>
      <span class="w" id="btWind"></span>
      <span class="t" id="btTitle"></span>
      <button id="btPlay" class="mini">Pause</button>
    </div>
    <div class="brow">
      <span class="gauge" id="btGauge"></span>
      <span class="rng" id="btRange"></span>
    </div>
    <input type="range" id="btDay" min="0" max="12" step="1" value="0">
    <div class="bx" id="btText"></div>
  </div>
</div>


<div id="about" class="sheet hidden">
  <button id="aboutClose" class="x">×</button>
  <div class="sheet-in" id="aboutBody"></div>
</div>

<script src="js/three.min.js"></script>

<script src="js/shaders.js?v=1788865724"></script>
<script src="js/sea.js?v=1788865724"></script>
<script src="js/hull.js?v=1788865724"></script>
<script src="js/shipwright.js?v=1788865724"></script>
<script src="js/yard.js?v=1788865724"></script>
<script src="js/passage.js?v=1788865724"></script>
<script src="js/battle.js?v=1788865724"></script>
<script src="js/app.js?v=1788865724"></script>
<script src="js/route.js?v=1788865724"></script>
</body>
</html>
